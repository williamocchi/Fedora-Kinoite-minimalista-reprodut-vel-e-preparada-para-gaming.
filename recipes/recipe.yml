---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: fedora-kinoite-cachyos

description: Fedora Kinoite minimalista com foco em performance e diagnóstico de hardware

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:

  # ------------------------------------------------------------
  # Ferramentas de diagnóstico de hardware
  #
  # lspci    -> pciutils
  # lsusb    -> usbutils
  # sensors  -> lm_sensors
  # smartctl -> smartmontools
  # inxi     -> inxi
  # btop     -> monitoramento em tempo real
  # ------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - pciutils
        - usbutils
        - lm_sensors
        - smartmontools
        - inxi
        - btop

  # ------------------------------------------------------------
  # Assinatura da imagem
  # ------------------------------------------------------------
  - type: signing
